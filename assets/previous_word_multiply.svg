<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">Previous-word finder, one token at a time</title>
  <desc id="desc">Sentence: is okay disobeys keep-speech. W_Q shifts each position one-hot to the previous position; K is the identity; V is the disobey bit 0 0 1 0. For each token: position one-hot times W_Q gives the previous position, dot K gives a single score of 1 at that position, times V gives the disobey bit of the previous word: is gives nothing, okay 0, disobeys 0, keep-speech 1.</desc>
