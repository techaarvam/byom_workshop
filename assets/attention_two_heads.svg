<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="860" viewBox="0 0 1180 860" role="img" aria-labelledby="title desc">
  <title id="title">Two heads at a glance</title>
  <desc id="desc">For two sentences, the QK-transpose score grid of each head: rows are queries, columns are keys. In the object head only the cell he-is? by the object word is bright; in the action head the cells he-is? by the two action words are bright. The bright cells pull out the payload bits: the object attributes and the correction. The four output bits are shown with the corrected object.</desc>
