  <text x="398.0" y="320" text-anchor="middle" class="num" fill="#fff">1</text>
  <rect x="422" y="292" width="43" height="43" rx="5" fill="#f1f5f9"/>
  <text x="444.0" y="320" text-anchor="middle" class="num" fill="#94a3b8">0</text>
  <rect x="468" y="292" width="43" height="43" rx="5" fill="#f1f5f9"/>
  <text x="490.0" y="320" text-anchor="middle" class="num" fill="#94a3b8">0</text>
  <rect x="514" y="292" width="43" height="43" rx="5" fill="#f1f5f9"/>
  <text x="536.0" y="320" text-anchor="middle" class="num" fill="#94a3b8">0</text>
  <path d="M568 313 L608 313" stroke="#2563a8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="618" y="319" class="res">gets 1  (the word before is disobeys)</text>
  <text x="320" y="367" text-anchor="end" class="small">3: swap-speech asks for 2</text>
  <rect x="330" y="338" width="43" height="43" rx="5" fill="#f1f5f9"/>
  <text x="352.0" y="366" text-anchor="middle" class="num" fill="#94a3b8">0</text>
  <rect x="376" y="338" width="43" height="43" rx="5" fill="#f1f5f9"/>
  <text x="398.0" y="366" text-anchor="middle" class="num" fill="#94a3b8">0</text>
  <rect x="422" y="338" width="43" height="43" rx="5" fill="#2563eb"/>
  <text x="444.0" y="366" text-anchor="middle" class="num" fill="#fff">1</text>
  <rect x="468" y="338" width="43" height="43" rx="5" fill="#f1f5f9"/>
  <text x="490.0" y="366" text-anchor="middle" class="num" fill="#94a3b8">0</text>
  <rect x="514" y="338" width="43" height="43" rx="5" fill="#f1f5f9"/>
  <text x="536.0" y="366" text-anchor="middle" class="num" fill="#94a3b8">0</text>
  <path d="M568 359 L608 359" stroke="#2563a8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="618" y="365" class="small">gets 0  (the word before is not disobeys)</text>
  <text x="320" y="413" text-anchor="end" class="small">4: he-is? asks for 3</text>
  <rect x="330" y="384" width="43" height="43" rx="5" fill="#f1f5f9"/>
  <text x="352.0" y="412" text-anchor="middle" class="num" fill="#94a3b8">0</text>
  <rect x="376" y="384" width="43" height="43" rx="5" fill="#f1f5f9"/>
  <text x="398.0" y="412" text-anchor="middle" class="num" fill="#94a3b8">0</text>
  <rect x="422" y="384" width="43" height="43" rx="5" fill="#f1f5f9"/>
  <text x="444.0" y="412" text-anchor="middle" class="num" fill="#94a3b8">0</text>
  <rect x="468" y="384" width="43" height="43" rx="5" fill="#2563eb"/>
  <text x="490.0" y="412" text-anchor="middle" class="num" fill="#fff">1</text>
  <rect x="514" y="384" width="43" height="43" rx="5" fill="#f1f5f9"/>
  <text x="536.0" y="412" text-anchor="middle" class="num" fill="#94a3b8">0</text>
  <path d="M568 405 L608 405" stroke="#2563a8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="618" y="411" class="small">gets 0  (the word before is not disobeys)</text>
  <text x="445.0" y="460" text-anchor="middle" class="small">score = query · key: 1 only where key = p − 1</text>
  <text x="445.0" y="484" text-anchor="middle" class="small">value of each word: 1 if it is disobeys, else 0</text>
</svg>
