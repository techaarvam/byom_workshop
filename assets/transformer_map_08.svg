<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" viewBox="0 0 1400 1200" role="img" aria-labelledby="title desc">
  <title id="title">Where notebook 08 fits in the transformer</title>
  <desc id="desc">Text is tokenized, embedded with positions, passed through N transformer blocks of LayerNorm, multi-head attention, LayerNorm and feed-forward with residual additions, then a final LayerNorm, output projection and softmax. Each part is tagged with the chapters that cover it; the data pipeline, training, faster training and post-training chapters sit alongside.</desc>
